<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · VulnTarget</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="page">
  <nav class="nav">
    <div class="nav-brand"><span class="brand-mark">🐞</span> VulnTarget</div>
    <div class="nav-links">
      <a href="/dashboard" class="active">Dashboard</a>
      <a href="/profile">Profile</a>
      <a href="/logout">Logout</a>
    </div>
  </nav>
  <main class="wrap">
    <div class="page-head">
      <h1>Bug Reports</h1>
      <span class="muted">Signed in as {{user}}</span>
    </div>
    <div class="filters muted">Filter by status:
      <a href="/filter?status=open">open</a> · <a href="/filter?status=closed">closed</a>
    </div>
    <table class="reports">
      <thead>
        <tr><th>ID</th><th>Title</th><th>Status</th><th>Submitted by</th><th>Date</th></tr>
      </thead>
      <tbody>{{{rows}}}</tbody>
    </table>
  </main>
</body>
</html>
